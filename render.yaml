# Render Blueprint for the Harlo API.
# This repo is a pnpm monorepo. Do not use `npm install`.
#
# In the Render dashboard, set:
#   Build command: corepack enable && corepack prepare pnpm@10.6.1 --activate && pnpm install --frozen-lockfile && NODE_OPTIONS=--max-old-space-size=4096 pnpm run build:backend
#   Start command: pnpm run start
# Do not use `pnpm run build` on this service — that also compiles the Next.js
# frontend and will run the instance out of memory.
# Frontend belongs on Vercel. Orchestrator is a second worker service with
#   pnpm run build:orchestrator / pnpm run start:prod:orchestrator
# and Temporal must be reachable at TEMPORAL_ADDRESS.
#
# Required env vars (full URLs with https:// — missing protocol causes Invalid URL):
#   DATABASE_URL              Paste Supabase Session pooler URI AS-IS (port 5432).
#                             Dashboard: Project Settings → Database → Connection string → URI
#                             Example:
#                             postgresql://postgres.sqnqpiaauuxyrsofajzo:PASSWORD@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
#                             Do NOT wrap in quotes. Prefer a password without @ # / ? so you
#                             can paste Supabase's URI unchanged. Start script auto-encodes if needed.
#   FRONTEND_URL              https://app.your-domain.com   (must include https://)
#   MAIN_URL                  https://app.your-domain.com
#   NEXT_PUBLIC_BACKEND_URL   https://YOUR-SERVICE.onrender.com
#   BACKEND_INTERNAL_URL      https://YOUR-SERVICE.onrender.com
#   JWT_SECRET                openssl rand -base64 48
#   REDIS_URL                 redis://... or rediss://... (optional; omit if unused)
# Missing https:// on FRONTEND/MAIN/BACKEND URLs causes: uncaughtException Invalid URL.

services:
  - type: web
    name: harlo-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack prepare pnpm@10.6.1 --activate && pnpm install --frozen-lockfile && NODE_OPTIONS=--max-old-space-size=4096 pnpm run build:backend
    # `pnpm run start` runs prisma-db-push before booting the API so new
    # schema columns (e.g. User.tokenRevokedAt) exist before auth queries run.
    startCommand: pnpm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
