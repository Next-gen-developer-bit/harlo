<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" fill="none">
  <!-- Black circle with H - Harlo Social brand icon -->
  <circle cx="32" cy="32" r="30" fill="#111111"/>
  <text
    x="32"
    y="45"
    font-family="'Arial Rounded MT Bold', 'Nunito', 'Poppins', Arial, sans-serif"
    font-weight="900"
    font-size="36"
    fill="white"
    text-anchor="middle"
    dominant-baseline="auto"
    letter-spacing="-1"
  >H</text>

  <!-- Harlo wordmark -->
  <text
    x="74"
    y="38"
    font-family="'Arial Rounded MT Bold', 'Nunito', 'Poppins', Arial, sans-serif"
    font-weight="900"
    font-size="32"
    fill="#111111"
    dominant-baseline="auto"
    letter-spacing="-0.5"
  >Harlo</text>

  <!-- Social subtext -->
  <text
    x="75"
    y="55"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-weight="400"
    font-size="11"
    fill="#111111"
    dominant-baseline="auto"
    letter-spacing="4"
  >SOCIAL</text>
</svg>
