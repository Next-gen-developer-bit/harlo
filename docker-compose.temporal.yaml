# Production Temporal for Harlo Social (Postgres visibility, no Elasticsearch).
# Scheduled posts require this server plus a running orchestrator worker.
#
# Same host as backend/orchestrator:
#   pnpm run temporal:up
#   TEMPORAL_ADDRESS=localhost:7233
#
# Backend/orchestrator in Docker on this network:
#   TEMPORAL_ADDRESS=temporal:7233
#
# Change the DB password before going live:
#   TEMPORAL_DB_PASSWORD=long-random pnpm run temporal:up
#
# Web UI is bound to localhost only. Do not publish 8233 on the public internet.

name: harlo-temporal

services:
  temporal-db:
    image: postgres:16-alpine
    container_name: harlo-temporal-db
    restart: always
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
    volumes:
      - harlo-temporal-pgdata:/var/lib/postgresql/data
    networks:
      - temporal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: harlo-temporal
    restart: always
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_SEEDS: temporal-db
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      ENABLE_ES: 'false'
      TEMPORAL_NAMESPACE: default
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/production-sql.yaml
    ports:
      - '7233:7233'
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks:
      - temporal
    healthcheck:
      test: ['CMD-SHELL', "bash -c ':> /dev/tcp/127.0.0.1/7233'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 25s

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: harlo-temporal-ui
    restart: always
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - '127.0.0.1:8233:8080'
    networks:
      - temporal

volumes:
  harlo-temporal-pgdata:

networks:
  temporal:
    name: harlo-temporal
